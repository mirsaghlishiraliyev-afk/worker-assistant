plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "az.asf.workerassistant"
    compileSdk 34
    defaultConfig {
        applicationId "az.asf.workerassistant"
        minSdk 24
        targetSdk 34
        // GitHub Actions-da: -PversionCode=<run nömrəsi> -PversionName=<proqramın versiyası>
        versionCode = Integer.parseInt(String.valueOf(project.findProperty("versionCode") ?: "1"))
        versionName = String.valueOf(project.findProperty("versionName") ?: "dev")
        ndk { abiFilters "arm64-v8a", "x86_64" }  // telefonlar və emulyator
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Sabit imza: hər qurulma eyni açarla imzalanır, ona görə yeni APK köhnənin üstünə quraşdırılır (məlumat itmir).
    // GitHub secret ANDROID_KEYSTORE_B64 (+ ANDROID_KEYSTORE_PAROL) verilibsə o istifadə olunur, yoxsa repodakı açar.
    signingConfigs {
        sabit {
            storeFile file(System.getenv("WA_KEYSTORE") ?: "../imza/wa.keystore")
            storePassword System.getenv("WA_KEYSTORE_PAROL") ?: "workerassistant"
            keyAlias System.getenv("WA_KEY_ALIAS") ?: "workerassistant"
            keyPassword System.getenv("WA_KEYSTORE_PAROL") ?: "workerassistant"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sabit }
        release { minifyEnabled false; signingConfig signingConfigs.sabit }
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        // FastAPI 0.99 + pydantic 1 (saf Python): Android-də Rust tələb edən pydantic-core lazım olmur
        pip { install "-r", "requirements-android.txt" }
        // statik fayllar (index.html, loqo) diskdə olmalıdır: paketlər APK-dan çıxarılır
        extractPackages "assistant", "uzlasma"
    }
}
