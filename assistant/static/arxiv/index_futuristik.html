<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker Assistant</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:dark;
  --bg:#05070d;--ink:#e8edff;--muted:#8891b4;--dim:#5b6386;
  --glass:rgba(255,255,255,.035);--glass-2:rgba(255,255,255,.06);--glass-3:rgba(255,255,255,.09);
  --line:rgba(148,163,255,.14);--line-2:rgba(148,163,255,.24);
  --cyan:#22d3ee;--violet:#8b5cf6;--pink:#ec4899;--green:#34d399;--amber:#fbbf24;--red:#fb7185;
  --grad:linear-gradient(135deg,var(--cyan),var(--violet) 55%,var(--pink));
  --mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --ok:var(--green);--no:var(--red);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.65 "Segoe UI Variable","Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(148,163,255,.18);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* ---------- fon: aurora + şəbəkə ---------- */
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,rgba(34,211,238,.16),transparent 70%),
             radial-gradient(35% 35% at 85% 20%,rgba(139,92,246,.20),transparent 70%),
             radial-gradient(45% 40% at 60% 95%,rgba(236,72,153,.12),transparent 70%);
  filter:blur(20px);animation:aurora 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(148,163,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,255,.05) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%)}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(-4%,3%,0) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){body::before,.logo::before,.ava::before{animation:none!important}}

.app{position:relative;z-index:1;display:flex;height:100vh}

/* ---------- yan panel ---------- */
aside{width:268px;flex:none;display:flex;flex-direction:column;padding:12px;transition:margin .25s;
  background:linear-gradient(180deg,rgba(14,17,30,.82),rgba(8,10,20,.82));backdrop-filter:blur(18px);border-right:1px solid var(--line)}
aside.gizli{margin-left:-268px;box-shadow:none!important}
.side-top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 12px}
.ikon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.ikon-btn:hover{background:var(--glass-2);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.yeni{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;font-weight:600;letter-spacing:.2px;
  background:var(--glass);border:1px solid var(--line);transition:.2s}
.yeni:hover{border-color:var(--line-2);background:var(--glass-2);box-shadow:0 0 24px rgba(139,92,246,.18)}
.logo{position:relative;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;isolation:isolate}
.logo::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,var(--cyan),var(--violet),var(--pink),var(--violet),var(--cyan));background-size:300% 300%;z-index:-1;animation:axin 8s ease-in-out infinite alternate;box-shadow:0 0 18px rgba(139,92,246,.55)}
@keyframes axin{0%{background-position:0% 0%}100%{background-position:100% 100%}}
@keyframes spin{to{transform:rotate(360deg)}}
.bolme{font-size:11px;color:var(--dim);padding:18px 12px 6px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
#tarixce{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.soh{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap;cursor:pointer;color:#c7cdea;transition:.15s}
.soh span{overflow:hidden;text-overflow:ellipsis}
.soh:hover{background:var(--glass-2)}
.soh.aktiv{background:var(--glass-3);color:var(--ink)}
.soh.aktiv::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 10px var(--violet)}
.soh .sil{opacity:0;color:var(--muted);font-size:13px;padding:0 4px}
.soh:hover .sil{opacity:1}
.mod{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;font-size:14px}
.mod .nq{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:nabiz 2.4s infinite}
@keyframes nabiz{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.mod.plan{color:var(--dim)}.mod.plan .nq{background:transparent;border:1px solid var(--dim);animation:none}
.mod .etiket{margin-left:auto;font:500 10px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim)}
.side-alt{border-top:1px solid var(--line);margin-top:8px;padding:12px 8px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-family:var(--mono)}
.side-alt b{color:var(--ink);font-weight:600;font-family:inherit}

/* ---------- əsas ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid transparent}
.model{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:17px;font-weight:650;letter-spacing:.3px}
.marka{background:linear-gradient(90deg,#fff,#c9d3ff 40%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.rejim{position:relative;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);cursor:default;border:1px solid var(--line);background:var(--glass)}
.rejim.qayda{color:var(--cyan)}.rejim.openai{color:var(--green)}.rejim.anthropic{color:var(--amber)}
.rejim:hover{box-shadow:0 0 16px currentColor}
.rejim::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:0;white-space:nowrap;background:rgba(14,17,30,.95);color:var(--ink);border:1px solid var(--line-2);
  font-size:12px;font-weight:400;padding:6px 10px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;backdrop-filter:blur(10px)}
.rejim:hover::after,.rejim:focus::after{opacity:1}
header .sag{margin-left:auto;font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
header .sag .fayl-ad:not(:empty){border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:3px 12px}
#acBtn{display:none}
aside.gizli ~ main #acBtn{display:grid}

#axin{flex:1;overflow:auto}
.sutun{max-width:820px;margin:0 auto;padding:12px 24px 40px}
.msj{margin:24px 0;animation:gir .35s ease-out}
@keyframes gir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msj.user{display:flex;justify-content:flex-end}
.msj.user .balon{position:relative;border-radius:18px 18px 4px 18px;padding:10px 18px;max-width:75%;white-space:pre-wrap;word-wrap:break-word;
  background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.20));border:1px solid rgba(139,92,246,.35);box-shadow:0 8px 30px rgba(139,92,246,.12)}
.msj.ai{display:flex;gap:14px}
.ava{position:relative;width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px;color:#fff;isolation:isolate}
.ava::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 90deg,var(--cyan),var(--violet),var(--pink),var(--cyan));z-index:-1;box-shadow:0 0 16px rgba(34,211,238,.35)}
.msj.ai:has(.yazir) .ava::before{animation:spin 1.2s linear infinite}
.msj.ai .icerik{flex:1;min-width:0}
.metn p{margin:0 0 10px}.metn p:last-child{margin:0}
.metn ul{margin:4px 0 10px;padding-left:22px}
.metn li::marker{color:var(--cyan)}
.metn b{color:#fff}
.metn code{font-family:var(--mono);background:var(--glass-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;color:var(--cyan)}
.cipler{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cip{display:inline-flex;align-items:center;gap:7px;font:500 11px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.06);border-radius:7px;padding:0 9px}
.cip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.ui{margin-top:14px}
.ui h4{margin:0 0 8px;font:600 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}

/* cədvəllər */
.cedvel-qab{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:440px;background:rgba(10,13,26,.6);backdrop-filter:blur(12px)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
table.genis{min-width:680px}
td.ad{min-width:150px}
th{position:sticky;top:0;z-index:1;text-align:left;padding:10px 12px;white-space:nowrap;font:600 10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
  background:rgba(16,20,38,.96);border-bottom:1px solid var(--line-2)}
td{border-top:1px solid var(--line);padding:9px 12px;vertical-align:top}
tbody tr{transition:background .15s}tbody tr:hover{background:rgba(139,92,246,.06)}
td small{color:var(--muted)}
td.reqem{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:13px;color:#cfe9ff}
.risk{display:inline-block;border-radius:6px;padding:0 8px;font:600 11px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border:1px solid}
.r-Yüksək{color:var(--red);border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.1);box-shadow:0 0 12px rgba(251,113,133,.18)}
.r-Orta{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.r-Aşağı{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.r-Məlumat{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.duymeler{display:flex;gap:6px;white-space:nowrap}
.kicik{border:1px solid var(--line-2);border-radius:9px;padding:4px 12px;font-size:13px;background:var(--glass);transition:.15s}
.kicik:hover{background:var(--glass-3)}
.kicik.b,.kicik.x{width:34px;padding:3px 0;font-weight:700}
.kicik.b{color:var(--green)}.kicik.b:hover{box-shadow:0 0 14px rgba(52,211,153,.45);border-color:var(--green)}
.kicik.x{color:var(--red)}.kicik.x:hover{box-shadow:0 0 14px rgba(251,113,133,.45);border-color:var(--red)}
.kicik:disabled{opacity:.4;cursor:default;box-shadow:none}
.qerar-Bəli{color:var(--green);font-weight:600}.qerar-Xeyr{color:var(--red);font-weight:600}

/* kartlar */
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kart{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(12px)}
.kart::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--grad);opacity:.8}
.kart .ad{font:600 10.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kart .deyer{font:650 21px/1.4 var(--mono);margin-top:4px;background:linear-gradient(90deg,#fff,#b9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.kart .alt{font-size:12px;color:var(--cyan)}

/* məktub */
.mektub{border:1px solid var(--line);border-radius:14px;padding:16px;background:rgba(10,13,26,.6);backdrop-filter:blur(12px)}
.mektub .sah{font-size:13px;color:var(--muted)}.mektub .sah b{color:var(--ink);font-weight:500}
.mektub textarea{width:100%;min-height:230px;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:14px;line-height:1.6;background:rgba(0,0,0,.25);color:var(--ink);resize:vertical;outline:0}
.mektub textarea:focus{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
a.duyme{display:inline-flex;align-items:center;gap:6px;background:var(--grad);color:#fff;padding:6px 16px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 6px 22px rgba(139,92,246,.35);transition:.15s}
a.duyme:hover{filter:brightness(1.12);box-shadow:0 6px 28px rgba(236,72,153,.4)}

.yazir{display:inline-flex;gap:5px;padding:12px 0}
.yazir i{width:7px;height:7px;border-radius:50%;background:var(--grad);animation:n 1.2s infinite ease-in-out}
.yazir i:nth-child(2){animation-delay:.15s}.yazir i:nth-child(3){animation-delay:.3s}
@keyframes n{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* ---------- boş vəziyyət ---------- */
#bos{flex:none;margin-top:auto;padding:24px 24px 28px;text-align:center}
#bos h1{font-size:34px;font-weight:650;margin:0;letter-spacing:-.5px;background:linear-gradient(90deg,#fff 10%,#b9c6ff 45%,var(--cyan) 70%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
#bos h1::after{content:"";display:block;width:64px;height:2px;margin:16px auto 0;background:var(--grad);border-radius:2px;box-shadow:0 0 14px var(--violet)}
#teklifQab{display:none;max-width:820px;margin:16px auto 0}
.teklifler{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.teklif{position:relative;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;background:var(--glass);backdrop-filter:blur(12px);transition:.2s}
.teklif:hover{border-color:rgba(139,92,246,.5);background:var(--glass-2);transform:translateY(-2px);box-shadow:0 10px 30px rgba(139,92,246,.18)}
.teklif b{display:block;font-weight:600;margin-top:2px}.teklif span{color:var(--muted);font-size:13px}
.teklif .modad{display:inline-block;font:600 10px/1.7 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--violet);border:1px solid rgba(139,92,246,.35);border-radius:6px;padding:0 6px;margin-bottom:6px}
main.bos #axin{display:none}
main:not(.bos) #bos{display:none}
main.bos .yazi-qab{margin-bottom:auto}
main.bos #teklifQab{display:block}
main.bos .alt-qeyd{display:none}

/* ---------- yazı sahəsi ---------- */
.yazi-qab{flex:none;padding:0 24px 16px}
.yazi{position:relative;max-width:820px;margin:0 auto;border-radius:22px;padding:10px 10px 10px 12px;
  background:rgba(12,15,30,.78);backdrop-filter:blur(20px);border:1px solid var(--line-2);box-shadow:0 20px 60px rgba(0,0,0,.45);transition:.2s}
.yazi::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);opacity:0;transition:opacity .25s;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.yazi:focus-within::before{opacity:1}
.yazi:focus-within{box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(139,92,246,.22)}
.elave{display:none;align-items:center;gap:10px;margin:2px 4px 8px;padding:8px 10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;font-size:13px;flex-wrap:wrap}
.elave.var{display:flex}
.elave .fikon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;display:grid;place-items:center;font:700 10px var(--mono);box-shadow:0 0 14px rgba(16,185,129,.4)}
.elave .fad{font-weight:600}.elave .fst{color:var(--muted);font-size:12px;font-family:var(--mono)}
.elave input[type=date]{border:1px solid var(--line-2);border-radius:8px;padding:3px 6px;background:rgba(0,0,0,.3);color:var(--ink);font:13px var(--mono)}
.setir{display:flex;align-items:flex-end;gap:8px}
#giris{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:200px;padding:7px 4px;line-height:1.5}
#giris::placeholder{color:var(--dim)}
.gonder{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 20px rgba(139,92,246,.45);transition:.15s}
.gonder:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 26px rgba(236,72,153,.5)}
.gonder:disabled{background:var(--glass-3);color:var(--dim);box-shadow:none;cursor:default}
.alt-qeyd{text-align:center;font:11px var(--mono);color:var(--dim);margin-top:10px;letter-spacing:.02em}

@media (max-width:760px){
  aside{position:fixed;z-index:10;height:100%;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sutun,.yazi-qab{padding-left:14px;padding-right:14px}
  .teklifler{grid-template-columns:1fr}
  .msj.user .balon{max-width:88%}
  #bos h1{font-size:26px}
  header .sag .fayl-ad{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside id="yan">
    <div class="side-top">
      <button class="ikon-btn" id="bagBtn" title="Paneli bağla" aria-label="Paneli bağla">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button class="ikon-btn" id="yeniIkon" title="Yeni söhbət" aria-label="Yeni söhbət">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <button class="yeni" id="yeniBtn"><div class="logo" aria-label="Worker Assistant"><svg width="20" height="20" viewBox="0 0 32 32">
    <polyline points="4.5,8 10,24 16,10.5 22,24 23.9,18.5" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12.6" y1="18.6" x2="19.4" y2="18.6" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/>
    <rect x="22.95" y="15.86" width="2.75" height="2.75" rx="0.41" fill="#fff" opacity="1.00"/>
    <rect x="23.93" y="13.45" width="2.53" height="2.53" rx="0.38" fill="#fff" opacity="0.90"/>
    <rect x="24.90" y="11.04" width="2.31" height="2.31" rx="0.35" fill="#fff" opacity="0.80"/>
    <rect x="25.88" y="8.63" width="2.09" height="2.09" rx="0.31" fill="#fff" opacity="0.70"/>
    <rect x="28.17" y="5.26" width="1.52" height="1.52" rx="0.23" fill="#fff" opacity="0.75"/>
    <rect x="29.19" y="6.84" width="1.24" height="1.24" rx="0.19" fill="#fff" opacity="0.60"/>
    <rect x="28.89" y="8.96" width="0.96" height="0.96" rx="0.14" fill="#fff" opacity="0.45"/>
    </svg></div>Yeni söhbət</button>
    <div class="bolme">Modullar</div>
    <div id="modullar"></div>
    <div class="bolme">Söhbətlər</div>
    <div id="tarixce"></div>
    <div class="side-alt" id="sideAlt">Fayl yüklənməyib</div>
  </aside>

  <main class="bos" id="main">
    <header>
      <button class="ikon-btn" id="acBtn" title="Paneli aç" aria-label="Paneli aç">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="model"><span class="marka">Worker Assistant</span><span class="rejim" id="rejim" tabindex="0" role="img"></span></div>
      <div class="sag"><span class="fayl-ad" id="faylBas"></span></div>
    </header>

    <div id="bos"><h1>Bu gün hansı işi həll edək?</h1></div>

    <div id="axin"><div class="sutun" id="sohbet"></div></div>

    <div class="yazi-qab" id="yaziQab">
      <form class="yazi" id="yaz" autocomplete="off">
        <div class="elave" id="elave">
          <div class="fikon">XLS</div>
          <div><div class="fad" id="eAd"></div><div class="fst" id="eSt"></div></div>
          <label class="fst">Dövrün sonu <input type="date" id="dovr"></label>
        </div>
        <div class="setir">
          <button type="button" class="ikon-btn" id="clip" title="Excel faylı əlavə et" aria-label="Excel faylı əlavə et">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <input type="file" id="fayl" accept=".xlsx,.xlsm" hidden>
          <textarea id="giris" rows="1" placeholder="Worker Assistant-a yazın…" aria-label="Mesaj"></textarea>
          <button type="submit" class="gonder" id="gonderBtn" disabled aria-label="Göndər">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <div id="teklifQab">
        <div class="teklifler" id="teklifler"></div>
      </div>
      <div class="alt-qeyd">Worker Assistant yalnız təklif edir. Təsdiqi siz verirsiniz, sənədlər avtomatik göndərilmir.</div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ALET = {xulase:"Ümumi vəziyyət", istisnalar:"İstisnalar", baglantilar:"Bağlantılar", baglantini_tesdiqle:"Təsdiq",
  borclar:"Borclar", qaime_axtar:"Qaimə axtarışı", borc_mektubu:"Borc məktubu", hesabat_yarat:"Excel hesabatı"};
const REQEM = new Set(["Cəmi","Ödənilib","Qalıq","ƏDV-siz","ƏDV","Gün"]);
const ACAR = "wa_sohbetler";
// Loqo: W içində A (Worker + Assistant); son xətt piksellərə çevrilir: əl işindən rəqəmsala keçid
const WA_IKON = '<svg width="19" height="19" viewBox="0 0 32 32"><polyline points="4.5,8 10,24 16,10.5 22,24 23.9,18.5" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><line x1="12.6" y1="18.6" x2="19.4" y2="18.6" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/><rect x="22.95" y="15.86" width="2.75" height="2.75" rx="0.41" fill="#fff" opacity="1.00"/><rect x="23.93" y="13.45" width="2.53" height="2.53" rx="0.38" fill="#fff" opacity="0.90"/><rect x="24.90" y="11.04" width="2.31" height="2.31" rx="0.35" fill="#fff" opacity="0.80"/><rect x="25.88" y="8.63" width="2.09" height="2.09" rx="0.31" fill="#fff" opacity="0.70"/><rect x="28.17" y="5.26" width="1.52" height="1.52" rx="0.23" fill="#fff" opacity="0.75"/><rect x="29.19" y="6.84" width="1.24" height="1.24" rx="0.19" fill="#fff" opacity="0.60"/><rect x="28.89" y="8.96" width="0.96" height="0.96" rx="0.14" fill="#fff" opacity="0.45"/></svg>';
const svg = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const REJIM_IKON = {
  qayda: svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),                       // qıfıl: AI-sız, lokal
  openai: svg('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'), // çip: lokal model
  anthropic: svg('<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.6 12.5 3.5 3.5 0 0 0 6 19Z"/>'),                       // bulud: xarici API
};

// ---------- söhbət tarixçəsi (yalnız bu brauzerdə) ----------
let sohbetler = [], aktiv = null, secilmisFayl = null;
try { sohbetler = JSON.parse(localStorage.getItem(ACAR) || "[]"); } catch { sohbetler = []; }
const saxla = () => { try { localStorage.setItem(ACAR, JSON.stringify(sohbetler.slice(0, 50))); } catch {} };

function tarixceCiz(){
  $("#tarixce").innerHTML = sohbetler.map(s =>
    `<div class="soh ${s.id === aktiv?.id ? "aktiv" : ""}" data-id="${s.id}"><span>${esc(s.ad)}</span><button class="sil" data-sil="${s.id}" title="Sil">✕</button></div>`).join("");
}
$("#tarixce").addEventListener("click", e => {
  const sil = e.target.closest("[data-sil]");
  if(sil){ sohbetler = sohbetler.filter(s => s.id !== sil.dataset.sil); if(aktiv?.id === sil.dataset.sil) yeniSohbet(); saxla(); tarixceCiz(); return; }
  const el = e.target.closest(".soh"); if(!el) return;
  aktiv = sohbetler.find(s => s.id === el.dataset.id);
  $("#sohbet").innerHTML = ""; aktiv.mesajlar.forEach(m => m.rol === "user" ? userMsj(m.metn) : aiMsj(m, false));
  $("#main").classList.toggle("bos", !aktiv.mesajlar.length); tarixceCiz();
});

async function yeniSohbet(){
  aktiv = null; $("#sohbet").innerHTML = ""; $("#main").classList.add("bos"); tarixceCiz();
  await fetch("/api/yeni", {method:"POST"}).catch(() => {});
  $("#giris").focus();
}
$("#yeniBtn").onclick = $("#yeniIkon").onclick = yeniSohbet;
$("#bagBtn").onclick = () => $("#yan").classList.add("gizli");
$("#acBtn").onclick = () => $("#yan").classList.remove("gizli");
if(innerWidth < 760) $("#yan").classList.add("gizli");

// ---------- vəziyyət ----------
(() => { const d = new Date(); d.setDate(0); $("#dovr").value = d.toISOString().slice(0,10); })();
function sideAlt(r){
  if(!r?.hazir){ $("#sideAlt").innerHTML = "Fayl yüklənməyib. 📎 ilə əlavə edin."; return; }
  const k = Object.fromEntries((r.xulase?.kartlar || []).map(x => [x.ad, x]));
  $("#sideAlt").innerHTML = `<div><b>${esc(r.fayl.replace(/^\d{8}_\d{6}_/, ""))}</b></div>
    <div>Dövrün sonu: ${esc(r.dovr_sonu.split("-").reverse().join("."))}</div>
    <div>Bağlanıb: ${esc(k["Avtomatik bağlanıb"]?.deyer)} · İstisna: ${esc(k["İstisnalar"]?.deyer)}</div>
    <div>Təsdiq gözləyir: ${esc(k["Təsdiq gözləyir"]?.deyer)}</div>`;
  $("#faylBas").textContent = r.fayl.replace(/^\d{8}_\d{6}_/, "") + " · " + r.dovr_sonu.split("-").reverse().join(".");
}
function modullarCiz(mods){
  $("#modullar").innerHTML = (mods || []).map(m => `<div class="mod ${m.status === "aktiv" ? "" : "plan"}" title="${esc(m.tesvir)}">
    <span class="nq"></span>${esc(m.ad)}${m.status === "aktiv" ? "" : '<span class="etiket">tezliklə</span>'}</div>`).join("");
  $("#teklifler").innerHTML = (mods || []).filter(m => m.status === "aktiv").flatMap(m => (m.teklifler || []).map(t =>
    `<button class="teklif" data-s="${esc(t.s)}"><span class="modad">${esc(m.ad)}</span><b>${esc(t.b)}</b><span>${esc(t.a)}</span></button>`)).join("");
}
async function veziyyet(){
  const r = await fetch("/api/veziyyet").then(r => r.json());
  const el = $("#rejim"), kod = r.rejim_kod || "qayda";
  el.className = "rejim " + kod; el.dataset.tip = r.rejim; el.setAttribute("aria-label", r.rejim);
  el.innerHTML = REJIM_IKON[kod] || REJIM_IKON.qayda;
  sideAlt(r); modullarCiz(r.modullar); return r;
}

// ---------- mətn formatı (sadə markdown) ----------
function md(t){
  const setirler = esc(t).split("\n"); let html = "", list = false;
  for(const s of setirler){
    const m = s.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!list){ html += "<ul>"; list = true; } html += `<li>${m[1]}</li>`; continue; }
    if(list){ html += "</ul>"; list = false; }
    if(s.trim()) html += `<p>${s}</p>`;
  }
  if(list) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}

// ---------- UI blokları ----------
function kartlarHtml(u){ return `<div class="kartlar">${u.kartlar.map(k => `<div class="kart"><div class="ad">${esc(k.ad)}</div><div class="deyer">${esc(k.deyer)}</div>${k.alt ? `<div class="alt">${esc(k.alt)}</div>` : ""}</div>`).join("")}</div>`; }
function cedvel(u){
  const ri = u.sutunlar.indexOf("Risk");
  const tr = u.setirler.map(s => "<tr>" + s.map((v,i) => i === ri ? `<td><span class="risk r-${esc(v)}">${esc(v)}</span></td>`
    : `<td class="${REQEM.has(u.sutunlar[i]) ? "reqem" : ""}">${esc(v)}</td>`).join("") + "</tr>").join("");
  return `<h4>${esc(u.basliq)} · ${u.setirler.length}</h4><div class="cedvel-qab"><table class="${u.sutunlar.length > 5 ? "genis" : ""}"><thead><tr>${u.sutunlar.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${tr || `<tr><td colspan="${u.sutunlar.length}">Nəticə yoxdur</td></tr>`}</tbody></table></div>`;
}
const qerarHtml = q => `<span class="qerar-${esc(q)}">${q === "Bəli" ? "✓ Təsdiq" : "✗ Rədd"}</span>`;
function baglantilar(u){
  const tr = u.setirler.map(r => `<tr data-o="${esc(r.odenis_id)}" data-q="${esc(r.qaime_id)}">
    <td>${esc(r.tarix)}<br><small>${esc(r.axin)}</small></td><td class="ad">${esc(r.kontragent)}<br><small>${esc(r.metn)}</small></td>
    <td><b>${esc(r.qaime_id)}</b></td><td class="reqem">${esc(r.baglanan)}</td>
    <td><span class="risk r-${r.etibar === "Yüksək" ? "Aşağı" : "Orta"}">${esc(r.etibar)}</span><br><small>${esc(r.qayda)}</small></td>
    <td class="qerar">${r.tesdiq ? qerarHtml(r.tesdiq) : `<div class="duymeler"><button class="kicik b" data-q2="Bəli" title="Təsdiqlə" aria-label="Təsdiqlə">✓</button><button class="kicik x" data-q2="Xeyr" title="Rədd et" aria-label="Rədd et">✗</button></div>`}</td></tr>`).join("");
  return `<h4>Bağlantılar · ${u.setirler.length}</h4><div class="cedvel-qab"><table class="genis"><thead><tr><th>Tarix</th><th>Ödəniş</th><th>Qaimə</th><th>Məbləğ</th><th>Etibar və qayda</th><th>Qərar</th></tr></thead><tbody>${tr || '<tr><td colspan="6">Təsdiq gözləyən bağlantı yoxdur</td></tr>'}</tbody></table></div>`;
}
const mailto = (kime, movzu, metn) => `mailto:${encodeURIComponent(kime)}?subject=${encodeURIComponent(movzu)}&body=${encodeURIComponent(metn)}`;
function mektub(u){
  return `<div class="mektub" data-kime="${esc(u.kime)}" data-movzu="${esc(u.movzu)}"><div class="sah">Kimə: <b>${esc(u.kime)}</b></div><div class="sah">Mövzu: <b>${esc(u.movzu)}</b></div>
    <textarea>${esc(u.metn)}</textarea>
    <div class="duymeler"><button type="button" class="kicik" data-kopyala>Kopyala</button><a class="duyme" href="${mailto(u.kime, u.movzu, u.metn)}" data-mailto>E-poçtda aç</a></div></div>`;
}
function uiBlok(u){
  if(!u) return "";
  if(u.tip === "cedvel") return cedvel(u);
  if(u.tip === "baglantilar") return baglantilar(u);
  if(u.tip === "mektub") return mektub(u);
  if(u.tip === "fayl") return `<a class="duyme" href="${esc(u.url)}" download>⬇ ${esc(u.ad)}</a>`;
  if(u.tip === "kartlar") return kartlarHtml(u);
  return "";
}

// ---------- mesajlar ----------
const asagi = () => { const a = $("#axin"); a.scrollTop = a.scrollHeight; };
function userMsj(t){
  const d = document.createElement("div"); d.className = "msj user";
  d.innerHTML = `<div class="balon">${esc(t)}</div>`; $("#sohbet").appendChild(d); asagi(); return d;
}
function aiQab(){
  const d = document.createElement("div"); d.className = "msj ai";
  d.innerHTML = `<div class="ava">${WA_IKON}</div><div class="icerik"><div class="yazir"><i></i><i></i><i></i></div></div>`;
  $("#sohbet").appendChild(d); asagi(); return d;
}
async function aiMsj(m, animasiya = true, qab = null){
  qab = qab || aiQab(); const ic = qab.querySelector(".icerik");
  const hs = m.hadiseler || [];
  ic.innerHTML = `<div class="metn"></div>`;
  const metnEl = ic.querySelector(".metn");
  if(animasiya){  // ChatGPT kimi hərf-hərf görünmə
    const sozler = (m.cavab || "").split(/(\s+)/);
    for(let i = 0; i < sozler.length; i++){ metnEl.textContent += sozler[i]; if(i % 3 === 0){ asagi(); await new Promise(r => setTimeout(r, 12)); } }
  }
  metnEl.innerHTML = md(m.cavab || "");
  if(hs.length) ic.insertAdjacentHTML("beforeend", `<div class="cipler">${hs.map(h => `<span class="cip">${esc(ALET[h.alet] || h.alet)}</span>`).join("")}</div>`);
  hs.forEach(h => { const b = uiBlok(h.ui); if(b) ic.insertAdjacentHTML("beforeend", `<div class="ui">${b}</div>`); });
  asagi();
}

let mesgul = false;
async function gonder(metn){
  metn = metn.trim(); if(!metn || mesgul) return;
  mesgul = true; yeniləDuyme();
  $("#main").classList.remove("bos");
  if(!aktiv){ aktiv = {id: Date.now().toString(36), ad: metn.slice(0, 40), mesajlar: []}; sohbetler.unshift(aktiv); tarixceCiz(); }
  aktiv.mesajlar.push({rol:"user", metn}); userMsj(metn);
  const qab = aiQab();
  let r;
  try{
    r = await fetch("/api/sohbet", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mesaj:metn})}).then(r => r.json());
  }catch(e){ r = {cavab: "Serverə qoşulmaq alınmadı: " + e.message, hadiseler: []}; }
  await aiMsj(r, true, qab);
  aktiv.mesajlar.push({rol:"ai", cavab:r.cavab, hadiseler:r.hadiseler}); saxla();
  if((r.hadiseler || []).some(h => h.alet === "baglantini_tesdiqle")) veziyyet();
  mesgul = false; yeniləDuyme();
}

// ---------- yazı sahəsi ----------
const giris = $("#giris");
function yeniləDuyme(){ $("#gonderBtn").disabled = mesgul || !giris.value.trim(); }
giris.addEventListener("input", () => { giris.style.height = "auto"; giris.style.height = giris.scrollHeight + "px"; yeniləDuyme(); });
giris.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#yaz").requestSubmit(); } });
$("#yaz").addEventListener("submit", e => { e.preventDefault(); const v = giris.value; giris.value = ""; giris.style.height = "auto"; gonder(v); });
$("#teklifler").addEventListener("click", e => { const b = e.target.closest(".teklif"); if(b) gonder(b.dataset.s); });

// ---------- fayl əlavə etmək ----------
$("#clip").onclick = () => $("#fayl").click();
$("#fayl").addEventListener("change", () => { secilmisFayl = $("#fayl").files[0]; if(secilmisFayl) yukle(); });
$("#dovr").addEventListener("change", () => { if(secilmisFayl) yukle(); });
async function yukle(){
  $("#elave").classList.add("var"); $("#eAd").textContent = secilmisFayl.name; $("#eSt").textContent = "Uzlaşdırılır…";
  const fd = new FormData(); fd.append("fayl", secilmisFayl); fd.append("dovr_sonu", $("#dovr").value);
  const r = await fetch("/api/yukle", {method:"POST", body:fd});
  if(!r.ok){ $("#eSt").textContent = (await r.json()).detail; return; }
  const j = await r.json(); sideAlt(j);
  const k = Object.fromEntries(j.xulase.kartlar.map(x => [x.ad, x.deyer]));
  $("#eSt").textContent = `Hazırdır · ${k["Avtomatik bağlanıb"]} bağlandı · ${k["İstisnalar"]} istisna`;
  if(!$("#main").classList.contains("bos")) await aiMsj({cavab:`«${secilmisFayl.name}» uzlaşdırıldı. Nə ilə başlayaq?`, hadiseler:[{alet:"xulase", ui:j.xulase}]}, false);
}

// ---------- cədvəl düymələri ----------
$("#sohbet").addEventListener("click", async e => {
  const b = e.target.closest("button[data-q2]");
  if(b){
    const tr = b.closest("tr"), dg = b.parentElement.querySelectorAll("button"); dg.forEach(x => x.disabled = true);
    const r = await fetch("/api/tesdiq", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({odenis_id:tr.dataset.o, qaime_id:tr.dataset.q, qerar:b.dataset.q2})});
    if(r.ok){ tr.querySelector(".qerar").innerHTML = qerarHtml(b.dataset.q2); veziyyet(); }
    else { dg.forEach(x => x.disabled = false); alert((await r.json()).detail); }
    return;
  }
  const k = e.target.closest("[data-kopyala]");
  if(k){ await navigator.clipboard.writeText(k.closest(".mektub").querySelector("textarea").value); k.textContent = "Kopyalandı ✓"; setTimeout(() => k.textContent = "Kopyala", 1500); }
});
$("#sohbet").addEventListener("input", e => {
  if(e.target.tagName !== "TEXTAREA") return;
  const box = e.target.closest(".mektub");
  box.querySelector("[data-mailto]").href = mailto(box.dataset.kime, box.dataset.movzu, e.target.value);
});

tarixceCiz();
veziyyet();
yeniləDuyme();
</script>
</body>
</html>
