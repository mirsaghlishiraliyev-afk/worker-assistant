<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker's Assistant</title>
<link rel="icon" href="/static/favicon.svg?v=boz" type="image/svg+xml">
<style>
/* Tema: qara panel, qırmızı skaner işığı, LED göstəricilər (80-ci illərin avtomobil paneli üslubu) */
:root{
  color-scheme:dark;
  --bg:#030303;--panel:#0b0b0c;--panel-2:#121214;--ink:#f2f2f2;--muted:#9a8f8f;--dim:#5f5656;
  --line:rgba(255,40,40,.16);--line-2:rgba(255,40,40,.32);
  --red:#ff2a2a;--red-2:#ff5a4a;--red-dim:#5a0a0a;--amber:#ffb020;--green:#3cff7a;--cyan:#ff5a4a;
  --glow:0 0 6px rgba(255,42,42,.9),0 0 18px rgba(255,42,42,.55),0 0 42px rgba(255,42,42,.3);
  --mono:"OCR A Std","Eurostile","Bank Gothic","JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --ok:var(--green);--no:var(--red);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.65 "Segoe UI Variable","Segoe UI",ui-sans-serif,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
::selection{background:rgba(255,42,42,.45)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,42,42,.22);border-radius:2px;border:3px solid transparent;background-clip:padding-box}

/* fon: qara parlaq panel + üfüqi skan xətləri + kənarlarda qaranlıq */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,30,30,.07),transparent 60%),radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85) 100%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

/* ---------- skaner (soldan sağa qaçan qırmızı işıq) ---------- */
.skaner{position:relative;height:6px;overflow:hidden;background:linear-gradient(180deg,#120202,#050000);border-top:1px solid #1d0505;border-bottom:1px solid #1d0505}
.skaner i{position:absolute;top:0;bottom:0;width:22%;left:0;
  background:linear-gradient(90deg,transparent,rgba(255,42,42,.18) 18%,rgba(255,42,42,.65) 38%,#ff3b3b 46%,#fff0f0 50%,#ff3b3b 54%,rgba(255,42,42,.65) 62%,rgba(255,42,42,.18) 82%,transparent);
  filter:blur(.4px);animation:skan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
.skaner i::after{content:"";position:absolute;inset:-8px 10%;background:radial-gradient(ellipse at 50% 50%,rgba(255,42,42,.7),transparent 65%);filter:blur(6px)}
@keyframes skan{from{left:-10%}to{left:88%}}
@media (prefers-reduced-motion:reduce){.mod .nq{animation:none!important}}

.app{position:relative;z-index:1;display:flex;height:100vh}

/* ---------- yan panel ---------- */
aside{width:268px;flex:none;display:flex;flex-direction:column;padding:12px;transition:margin .25s;
  background:linear-gradient(180deg,#0e0e10,#060607);border-right:1px solid #1a1a1c;box-shadow:inset -1px 0 0 rgba(255,42,42,.08)}
aside.gizli{margin-left:-268px;box-shadow:none!important}
.side-top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 12px}
.ikon-btn{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:var(--muted);transition:.15s;border:1px solid transparent}
.ikon-btn:hover{color:var(--red);border-color:var(--line-2);box-shadow:inset 0 0 12px rgba(255,42,42,.15)}
.yeni{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:4px;font:600 13px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;
  background:linear-gradient(180deg,#19191c,#0c0c0e);border:1px solid #2a2a2e;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #000;transition:.15s}
.yeni:hover{border-color:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 16px rgba(255,42,42,.25);color:#fff}
.logo{position:relative;width:30px;height:30px;border-radius:4px;display:grid;place-items:center;isolation:isolate}
.logo::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#5a5a60,#36363b);z-index:-1;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 0 #000}
.bolme{font:600 10.5px/1 var(--mono);color:var(--dim);padding:20px 12px 8px;letter-spacing:.22em;text-transform:uppercase}
#tarixce{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.soh{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;border-radius:3px;font-size:14px;white-space:nowrap;cursor:pointer;color:#cfc6c6;transition:.12s}
.soh span{overflow:hidden;text-overflow:ellipsis}
.soh:hover{background:#151517}
.soh.aktiv{background:linear-gradient(90deg,rgba(255,42,42,.14),transparent);color:#fff}
.soh.aktiv::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--red);box-shadow:var(--glow)}
.soh .sil{opacity:0;color:var(--muted);font-size:13px;padding:0 4px}
.soh:hover .sil{opacity:1}
.mod{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:14px}
.mod .nq{width:9px;height:9px;border-radius:1px;background:var(--green);flex:none;box-shadow:0 0 8px var(--green);animation:yan 1.6s steps(1) infinite}
@keyframes yan{50%{opacity:.35}}
.mod.plan{color:var(--dim)}.mod.plan .nq{background:#2a1010;box-shadow:none;animation:none;border:1px solid #3a1515}
.mod .etiket{margin-left:auto;font:600 9.5px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.14em;border:1px solid #3a2a0a;border-radius:2px;padding:0 6px;color:var(--amber);background:rgba(255,176,32,.06)}
.side-alt{border-top:1px solid #1a1a1c;margin-top:8px;padding:12px 8px 4px;font:12px/1.7 var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:2px}
.side-alt b{color:var(--red);font-weight:600;text-shadow:0 0 8px rgba(255,42,42,.6)}

/* ---------- əsas ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{position:relative;height:58px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:linear-gradient(180deg,#0d0d0f,#050506)}
.model{display:flex;align-items:center;gap:10px;padding:6px 8px}
.marka{font:700 16px/1 var(--mono);text-transform:uppercase;letter-spacing:.28em;color:#fff;text-shadow:0 0 10px rgba(255,42,42,.35)}
.rejim{position:relative;width:28px;height:28px;border-radius:3px;display:grid;place-items:center;cursor:default;border:1px solid #2a2a2e;background:linear-gradient(180deg,#19191c,#0c0c0e)}
.rejim.qayda{color:var(--amber)}.rejim.openai{color:var(--green)}.rejim.anthropic{color:var(--red)}
.rejim:hover{box-shadow:0 0 14px currentColor}
.rejim::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:0;white-space:nowrap;background:#0b0b0c;color:var(--ink);border:1px solid var(--line-2);
  font:12px var(--mono);padding:6px 10px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.rejim:hover::after,.rejim:focus::after{opacity:1}
header .sag{margin-left:auto;font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
header .sag .fayl-ad{text-transform:none}
header .sag .fayl-ad:not(:empty){border:1px solid #2a2a2e;background:#0a0a0b;border-radius:2px;padding:3px 12px;color:var(--amber);text-shadow:0 0 6px rgba(255,176,32,.5)}
#acBtn{display:none}
aside.gizli ~ main #acBtn{display:grid}

#axin{flex:1;overflow:auto;padding-top:6px}
.sutun{max-width:820px;margin:0 auto;padding:12px 24px 40px}
.msj{margin:24px 0;animation:gir .3s ease-out}
@keyframes gir{from{opacity:0}to{opacity:1}}
.msj.user{display:flex;justify-content:flex-end}
.msj.user .balon{border-radius:3px;padding:10px 16px;max-width:75%;white-space:pre-wrap;word-wrap:break-word;
  background:linear-gradient(180deg,#1a1a1d,#0f0f11);border:1px solid #2c2c30;border-right:3px solid var(--red);box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.05)}
.msj.ai{display:flex;gap:14px}
.ava{position:relative;width:34px;height:34px;flex:none;border-radius:3px;display:grid;place-items:center;margin-top:1px;isolation:isolate;border:1px solid #2a2a2e;background:#0a0a0b}
.ava::before{content:"";position:absolute;inset:3px;border-radius:2px;background:linear-gradient(180deg,#5a5a60,#36363b);z-index:-1;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.msj.ai .icerik{flex:1;min-width:0}
.metn p{margin:0 0 10px}.metn p:last-child{margin:0}
.metn ul{margin:4px 0 10px;padding-left:22px}
.metn li::marker{color:var(--red)}
.metn b{color:#fff}
.metn code{font-family:var(--mono);background:#120404;border:1px solid var(--line);border-radius:2px;padding:1px 6px;font-size:13px;color:var(--red-2)}
.cipler{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cip{display:inline-flex;align-items:center;gap:8px;font:600 10.5px/2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--amber);border:1px solid #3a2a0a;background:rgba(255,176,32,.05);border-radius:2px;padding:0 10px}
.cip::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.ui{margin-top:14px}
.ui h4{margin:0 0 8px;font:600 10.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.22em;color:var(--red);text-shadow:0 0 8px rgba(255,42,42,.5)}

/* səs modulyatoru: AI düşünəndə qırmızı sütunlar */
.yazir,.ses{display:inline-flex;align-items:center;gap:4px;height:30px;padding:2px 0}
.ses i{width:6px;height:100%;background:var(--red);box-shadow:var(--glow);border-radius:1px;transform-origin:center;animation:ses .5s ease-in-out infinite alternate}
.ses i:nth-child(1),.ses i:nth-child(5){animation-delay:-.35s;opacity:.7}
.ses i:nth-child(2),.ses i:nth-child(4){animation-delay:-.15s}
@keyframes ses{0%{transform:scaleY(.12)}100%{transform:scaleY(1)}}

/* cədvəllər */
.cedvel-qab{overflow:auto;border:1px solid #232327;border-radius:3px;max-height:440px;background:linear-gradient(180deg,#0d0d0f,#08080a);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
table.genis{min-width:680px}
td.ad{min-width:150px}
th{position:sticky;top:0;z-index:1;text-align:left;padding:10px 12px;white-space:nowrap;font:600 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--muted);
  background:#121214;border-bottom:1px solid var(--red-dim);box-shadow:0 1px 0 rgba(255,42,42,.25)}
td{border-top:1px solid #1b1b1e;padding:9px 12px;vertical-align:top}
tbody tr{transition:background .12s}tbody tr:hover{background:rgba(255,42,42,.05)}
td small{color:var(--muted)}
td.reqem{text-align:right;white-space:nowrap;font:600 13px var(--mono);color:var(--amber);text-shadow:0 0 6px rgba(255,176,32,.35)}
.risk{display:inline-block;border-radius:2px;padding:0 8px;font:700 10.5px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;border:1px solid}
.r-Yüksək{color:#fff;background:#b30000;border-color:var(--red);box-shadow:0 0 12px rgba(255,42,42,.55);text-shadow:0 0 4px #fff}
.r-Orta{color:var(--amber);border-color:#5a3c06;background:rgba(255,176,32,.08)}
.r-Aşağı{color:var(--green);border-color:#0d4a22;background:rgba(60,255,122,.06)}
.r-Məlumat{color:#9fb4ff;border-color:#24305a;background:rgba(120,150,255,.06)}
.duymeler{display:flex;gap:6px;white-space:nowrap}
.kicik{border:1px solid #2c2c30;border-radius:3px;padding:4px 12px;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(180deg,#1a1a1d,#0d0d0f);box-shadow:0 2px 0 #000;transition:.12s}
.kicik:hover{border-color:var(--red)}
.kicik:active{transform:translateY(1px);box-shadow:none}
.kicik.b,.kicik.x{width:34px;padding:3px 0;font-weight:700}
.kicik.b{color:var(--green)}.kicik.b:hover{box-shadow:0 0 12px rgba(60,255,122,.5);border-color:var(--green)}
.kicik.x{color:var(--red)}.kicik.x:hover{box-shadow:0 0 12px rgba(255,42,42,.6)}
.kicik:disabled{opacity:.4;cursor:default;box-shadow:none}
.qerar-Bəli{color:var(--green);font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 8px rgba(60,255,122,.6)}
.qerar-Xeyr{color:var(--red);font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 8px rgba(255,42,42,.6)}

/* kartlar: LED göstəricilər */
.kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kart{position:relative;border:1px solid #232327;border-radius:3px;padding:12px 14px 12px 16px;background:linear-gradient(180deg,#121214,#08080a);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 0 #000}
.kart::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--red);box-shadow:var(--glow)}
.kart .ad{font:600 9.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.kart .deyer{font:700 22px/1.35 var(--mono);margin-top:4px;color:var(--red-2);text-shadow:0 0 8px rgba(255,42,42,.75),0 0 22px rgba(255,42,42,.35)}
.kart .alt{font:11px var(--mono);color:var(--amber);letter-spacing:.06em}

/* məktub */
.mektub{border:1px solid #232327;border-radius:3px;padding:16px;background:linear-gradient(180deg,#0f0f11,#08080a)}
.mektub .sah{font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.mektub .sah b{color:var(--ink);font-weight:500;text-transform:none;letter-spacing:0;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
.mektub textarea{width:100%;min-height:230px;margin:12px 0;padding:14px;border:1px solid #2a2a2e;border-radius:2px;font-family:inherit;font-size:14px;line-height:1.6;background:#050506;color:var(--ink);resize:vertical;outline:0}
.mektub textarea:focus{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 18px rgba(255,42,42,.2)}
a.duyme{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#e01818,#8a0000);color:#fff;padding:6px 16px;border-radius:3px;text-decoration:none;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--red);box-shadow:0 0 14px rgba(255,42,42,.45),0 2px 0 #000;transition:.12s}
a.duyme:hover{box-shadow:var(--glow)}

/* ---------- boş vəziyyət ---------- */
#bos{flex:none;margin-top:auto;padding:24px 24px 28px;text-align:center}
#bos h1{font:700 26px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.2em;margin:0;color:#fff;text-shadow:0 0 12px rgba(255,42,42,.45)}
#bos .skaner{width:min(460px,80%);margin:24px auto 0;border-radius:3px;height:8px;overflow:visible;box-shadow:inset 0 0 6px #000}
#teklifQab{display:none;max-width:820px;margin:16px auto 0}
.teklifler{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.teklif{position:relative;text-align:left;border:1px solid #232327;border-radius:3px;padding:12px 16px 12px 18px;font-size:14px;background:linear-gradient(180deg,#121214,#09090a);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 2px 0 #000;transition:.12s}
.teklif::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;background:#3a0c0c;transition:.12s}
.teklif:hover{border-color:#3a1515}
.teklif:hover::before{background:var(--red);box-shadow:var(--glow)}
.teklif:active{transform:translateY(1px)}
.teklif b{display:block;font-weight:600;margin-top:2px}.teklif span{color:var(--muted);font-size:13px}
.teklif .modad{display:inline-block;font:700 9.5px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--amber);margin-bottom:4px}
main.bos #axin{display:none}
main:not(.bos) #bos{display:none}
main.bos .yazi-qab{margin-bottom:auto}
main.bos #teklifQab{display:block}
main.bos .alt-qeyd{display:none}

/* ---------- yazı sahəsi ---------- */
.yazi-qab{flex:none;padding:0 24px 16px}
.yazi{position:relative;max-width:820px;margin:0 auto;border-radius:4px;padding:10px 10px 10px 12px;
  background:linear-gradient(180deg,#121214,#08080a);border:1px solid #2a2a2e;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 40px rgba(0,0,0,.6);transition:.15s}
.yazi:focus-within{border-color:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(255,42,42,.35),0 0 30px rgba(255,42,42,.18)}
.elave{display:none;align-items:center;gap:10px;margin:2px 4px 8px;padding:8px 10px;background:#060607;border:1px solid #232327;border-radius:3px;font-size:13px;flex-wrap:wrap}
.elave.var{display:flex}
.elave{position:relative;overflow:hidden}
.elave.isleyir::after{content:"";position:absolute;left:-30%;bottom:0;height:2px;width:30%;
  background:linear-gradient(90deg,transparent,#ff3b3b,#fff0f0,#ff3b3b,transparent);box-shadow:0 0 10px #ff2a2a;animation:elaveSkan 1.4s ease-in-out infinite alternate}
@keyframes elaveSkan{from{left:-30%}to{left:100%}}
.elave .fikon{width:34px;height:34px;border-radius:2px;background:#062a12;color:var(--green);border:1px solid #0d4a22;display:grid;place-items:center;font:700 10px var(--mono);text-shadow:0 0 6px var(--green)}
.hazirlar{display:none;flex-direction:column;gap:5px;margin:10px 2px 0}
.hazirlar .hs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hazirlar .hs .hazir-s{flex-shrink:0;white-space:nowrap}
main.bos .hazirlar{display:none!important}  /* boş ekranda sorğular aşağıdakı kartlarda göstərilir */
.hazirlar.var{display:flex}
.hazirlar .bas{width:100%;font:700 9.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--amber)}
.hazir-s{border:1px solid #2a1212;background:linear-gradient(180deg,#121214,#09090a);color:var(--text,#e8e8ea);border-radius:2px;padding:6px 10px;font-size:12.5px;cursor:pointer;transition:.12s;text-align:left}
.hazir-s:hover{border-color:var(--red);box-shadow:0 0 8px rgba(255,40,40,.35)}
.hazir-s:disabled{opacity:.5;cursor:default}
.sual-v{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sual-v .sv{border:1px solid #2a2a2e;background:#0b0b0c;color:var(--text,#e8e8ea);border-radius:2px;padding:7px 12px;font-size:13px;cursor:pointer}
.sual-v .sv:hover{border-color:var(--red);box-shadow:0 0 8px rgba(255,40,40,.35)}
.sual-v .sv.esas{border-color:var(--green);color:var(--green)}
.sual-v .sv.ikinci{color:var(--muted,#888)}
.sual-v.cavablandi .sv{opacity:.35;pointer-events:none}
.elave .deyis{margin-left:auto;background:#000;border:1px solid #3a1414;color:var(--red, #ff3b3b);border-radius:2px;padding:5px 10px;font:12px var(--mono);cursor:pointer}
.elave .deyis:hover{border-color:#ff3b3b;box-shadow:0 0 8px rgba(255,40,40,.4)}
.elave.isleyir .deyis{display:none}
.elave .fad{font-weight:600}.elave .fst{color:var(--amber);font:12px var(--mono)}
.elave input[type=date]{border:1px solid #2a2a2e;border-radius:2px;padding:3px 6px;background:#000;color:var(--amber);font:13px var(--mono)}
.setir{display:flex;align-items:flex-end;gap:8px}
#giris{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;max-height:200px;padding:7px 4px;line-height:1.5}
#giris::placeholder{color:var(--dim);font-family:var(--mono);letter-spacing:.06em;font-size:13.5px}
.gonder{width:40px;height:38px;border-radius:3px;background:linear-gradient(180deg,#e01818,#8a0000);color:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--red);box-shadow:0 0 14px rgba(255,42,42,.5),0 2px 0 #000;transition:.12s}
.gonder:hover:not(:disabled){box-shadow:var(--glow)}
.gonder:active:not(:disabled){transform:translateY(1px)}
.gonder:disabled{background:linear-gradient(180deg,#1a1a1d,#0d0d0f);color:var(--dim);border-color:#2a2a2e;box-shadow:0 2px 0 #000;cursor:default}
.alt-qeyd{text-align:center;font:11px var(--mono);color:var(--dim);margin-top:10px;letter-spacing:.04em}

@media (max-width:760px){
  aside{position:fixed;z-index:10;height:100%;box-shadow:0 0 60px rgba(0,0,0,.8)}
  .sutun,.yazi-qab{padding-left:14px;padding-right:14px}
  .teklifler{grid-template-columns:1fr}
  .msj.user .balon{max-width:88%}
  #bos h1{font-size:19px;letter-spacing:.14em}
  .marka{letter-spacing:.16em;font-size:14px}
  header .sag .fayl-ad{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside id="yan">
    <div class="side-top">
      <button class="ikon-btn" id="bagBtn" title="Paneli bağla" aria-label="Paneli bağla">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button class="ikon-btn" id="yeniIkon" title="Yeni söhbət" aria-label="Yeni söhbət">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <button class="yeni" id="yeniBtn"><div class="logo" aria-label="Worker's Assistant"><svg width="20" height="20" viewBox="0 0 32 32">
    <polyline points="4.5,8 10,24 16,10.5 22,24 23.9,18.5" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12.6" y1="18.6" x2="19.4" y2="18.6" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/>
    <rect x="22.95" y="15.86" width="2.75" height="2.75" rx="0.41" fill="#fff" opacity="1.00"/>
    <rect x="23.93" y="13.45" width="2.53" height="2.53" rx="0.38" fill="#fff" opacity="0.90"/>
    <rect x="24.90" y="11.04" width="2.31" height="2.31" rx="0.35" fill="#fff" opacity="0.80"/>
    <rect x="25.88" y="8.63" width="2.09" height="2.09" rx="0.31" fill="#fff" opacity="0.70"/>
    <rect x="28.17" y="5.26" width="1.52" height="1.52" rx="0.23" fill="#fff" opacity="0.75"/>
    <rect x="29.19" y="6.84" width="1.24" height="1.24" rx="0.19" fill="#fff" opacity="0.60"/>
    <rect x="28.89" y="8.96" width="0.96" height="0.96" rx="0.14" fill="#fff" opacity="0.45"/>
    </svg></div>Yeni söhbət</button>
    <div class="bolme">Modullar</div>
    <div id="modullar"></div>
    <div class="bolme">Söhbətlər</div>
    <div id="tarixce"></div>
    <div class="side-alt" id="sideAlt">Fayl yüklənməyib</div>
  </aside>

  <main class="bos" id="main">
    <header>
      <button class="ikon-btn" id="acBtn" title="Paneli aç" aria-label="Paneli aç">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <div class="model"><span class="marka" lang="en">Worker's Assistant</span><span class="rejim" id="rejim" tabindex="0" role="img"></span></div>
      <div class="sag"><span class="fayl-ad" id="faylBas"></span></div>
    </header>

    <div id="bos"><h1>Bu gün hansı işi həll edək?</h1><div class="skaner" aria-hidden="true"><i></i></div></div>

    <div id="axin"><div class="sutun" id="sohbet"></div></div>

    <div class="yazi-qab" id="yaziQab">
      <form class="yazi" id="yaz" autocomplete="off">
        <div class="elave" id="elave">
          <div class="fikon">XLS</div>
          <div><div class="fad" id="eAd"></div><div class="fst" id="eSt"></div></div>
          <label class="fst" id="dovrQab" style="display:none" title="Yalnız uzlaşma faylı üçün">Dövrün sonu <input type="date" id="dovr"></label>
          <button type="button" class="deyis" id="deyisBtn" title="Başqa Excel faylı seç — son sual yeni fayl üzrə cavablandırılacaq">⟳ Faylı dəyiş</button>
        </div>
        <div class="setir">
          <button type="button" class="ikon-btn" id="clip" title="Excel faylı əlavə et (bir neçəsini birlikdə seçmək olar: bank çıxarışı + inteqrasiya şablonu)" aria-label="Excel faylı əlavə et">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <input type="file" id="fayl" accept=".xlsx,.xlsm" multiple hidden>
          <textarea id="giris" rows="1" placeholder="Worker's Assistant-a yazın…" aria-label="Mesaj"></textarea>
          <button type="submit" class="gonder" id="gonderBtn" disabled aria-label="Göndər">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <div class="hazirlar" id="hazirlar" aria-label="Bu fayl üçün hazır sorğular"></div>
      <div id="teklifQab">
        <div class="teklifler" id="teklifler"></div>
      </div>
      <div class="alt-qeyd">Worker's Assistant yalnız təklif edir. Təsdiqi siz verirsiniz, sənədlər avtomatik göndərilmir.</div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
// giriş müddəti bitəndə (401) — giriş səhifəsinə
const _fetch = window.fetch.bind(window);
window.fetch = async (...a) => { const r = await _fetch(...a); if(r.status === 401) location.href = "/giris"; return r; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ALET = {xulase:"Ümumi vəziyyət", istisnalar:"İstisnalar", baglantilar:"Bağlantılar", baglantini_tesdiqle:"Təsdiq",
  borclar:"Borclar", qaime_axtar:"Qaimə axtarışı", borc_mektubu:"Borc məktubu", hesabat_yarat:"Excel hesabatı",
  excel_xulase:"Faylın strukturu", sutunlar:"Sütunlar", setirler:"Sətirlər", qrupla:"Hesablama", en_boyuk:"Sıralama", axtar:"Axtarış", problemler:"Problemlər", vereq_tap:"Vərəq axtarışı", obyekt_gostericisi:"Obyekt üzrə göstərici", cem_hesabla:"Cəm hesablama", movzu_goster:"Mövzu", hesab_ayarla:"Hesab ayarı", bank_xulase:"Bank xülasəsi", bank_siyahi:"Daxilolmalar", bank_teyin:"Kateqoriya təyini", bank_madde:"Maddə", bank_hesabat:"1C faylı", bank_sual:"Mühasibə sual", bank_kec:"Sonraya"};
const reqemF = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const REQEM_DEYER = /^-?\d[\d\s]*(,\d+)?$/;
const REQEM = new Set(["Cəmi","Ödənilib","Qalıq","ƏDV-siz","ƏDV","Gün"]);
const ACAR = "wa_sohbetler";
// Loqo: W içində A (Worker + Assistant); son xətt piksellərə çevrilir: əl işindən rəqəmsala keçid
const WA_IKON = '<svg width="19" height="19" viewBox="0 0 32 32"><polyline points="4.5,8 10,24 16,10.5 22,24 23.9,18.5" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><line x1="12.6" y1="18.6" x2="19.4" y2="18.6" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/><rect x="22.95" y="15.86" width="2.75" height="2.75" rx="0.41" fill="#fff" opacity="1.00"/><rect x="23.93" y="13.45" width="2.53" height="2.53" rx="0.38" fill="#fff" opacity="0.90"/><rect x="24.90" y="11.04" width="2.31" height="2.31" rx="0.35" fill="#fff" opacity="0.80"/><rect x="25.88" y="8.63" width="2.09" height="2.09" rx="0.31" fill="#fff" opacity="0.70"/><rect x="28.17" y="5.26" width="1.52" height="1.52" rx="0.23" fill="#fff" opacity="0.75"/><rect x="29.19" y="6.84" width="1.24" height="1.24" rx="0.19" fill="#fff" opacity="0.60"/><rect x="28.89" y="8.96" width="0.96" height="0.96" rx="0.14" fill="#fff" opacity="0.45"/></svg>';
const svg = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const REJIM_IKON = {
  qayda: svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),                       // qıfıl: AI-sız, lokal
  openai: svg('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'), // çip: lokal model
  anthropic: svg('<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.6 12.5 3.5 3.5 0 0 0 6 19Z"/>'),                       // bulud: xarici API
};

// ---------- söhbət tarixçəsi (yalnız bu brauzerdə) ----------
let sohbetler = [], aktiv = null, secilmisFayl = null, secilmisFayllar = [];
try { sohbetler = JSON.parse(localStorage.getItem(ACAR) || "[]"); } catch { sohbetler = []; }
const saxla = () => { try { localStorage.setItem(ACAR, JSON.stringify(sohbetler.slice(0, 50))); } catch {} };

function tarixceCiz(){
  $("#tarixce").innerHTML = sohbetler.map(s =>
    `<div class="soh ${s.id === aktiv?.id ? "aktiv" : ""}" data-id="${s.id}"><span>${esc(s.ad)}</span><button class="sil" data-sil="${s.id}" title="Sil">✕</button></div>`).join("");
}
$("#tarixce").addEventListener("click", e => {
  const sil = e.target.closest("[data-sil]");
  if(sil){ sohbetler = sohbetler.filter(s => s.id !== sil.dataset.sil); if(aktiv?.id === sil.dataset.sil) yeniSohbet(); saxla(); tarixceCiz(); return; }
  const el = e.target.closest(".soh"); if(!el) return;
  aktiv = sohbetler.find(s => s.id === el.dataset.id);
  $("#sohbet").innerHTML = ""; aktiv.mesajlar.forEach(m => m.rol === "user" ? userMsj(m.metn) : aiMsj(m, false));
  $("#main").classList.toggle("bos", !aktiv.mesajlar.length); tarixceCiz();
});

async function yeniSohbet(){
  aktiv = null; $("#sohbet").innerHTML = ""; $("#main").classList.add("bos"); tarixceCiz();
  await fetch("/api/yeni", {method:"POST"}).catch(() => {});
  $("#giris").focus();
}
$("#yeniBtn").onclick = $("#yeniIkon").onclick = yeniSohbet;
$("#bagBtn").onclick = () => $("#yan").classList.add("gizli");
$("#acBtn").onclick = () => $("#yan").classList.remove("gizli");
if(innerWidth < 760) $("#yan").classList.add("gizli");

// ---------- vəziyyət ----------
function sideAlt(r){
  if(!r?.hazir){ $("#sideAlt").innerHTML = "Fayl yüklənməyib. 📎 ilə əlavə edin."; $("#faylBas").textContent = ""; return; }
  const ad = r.fayl, ex = r.excel || {};
  let html = `<div><b>${esc(ad)}</b></div><div>${esc(ex.vereq)} vərəq · ${esc(reqemF(ex.setir))} sətir</div>`;
  if(r.bank){
    html += `<div>Rejim: Bank daxilolmaları</div><div>Daxilolma: ${esc(reqemF(r.bank.daxilolma))} · Yoxlanmalı: ${esc(r.bank.yoxlanmali)}</div>`;
    if(!$("#elave").classList.contains("isleyir")) $("#eSt").textContent = `Bank çıxarışı · ${reqemF(r.bank.daxilolma)} daxilolma · ${r.bank.yoxlanmali} yoxlanmalı`;
  } else if(r.uzlasma){
    const k = Object.fromEntries((r.xulase?.kartlar || []).map(x => [x.ad, x]));
    html += `<div>Dövrün sonu: ${esc(r.dovr_sonu.split("-").reverse().join("."))}</div>
      <div>Bağlanıb: ${esc(k["Avtomatik bağlanıb"]?.deyer)} · İstisna: ${esc(k["İstisnalar"]?.deyer)}</div>
      <div>Təsdiq gözləyir: ${esc(k["Təsdiq gözləyir"]?.deyer)}</div>`;
  } else {
    html += `<div>Rejim: Excel analizi</div>`;
  }
  $("#sideAlt").innerHTML = html;
  $("#faylBas").textContent = ad + (r.uzlasma ? " · " + r.dovr_sonu.split("-").reverse().join(".") : "");
}
// Server versiyası: kod yenilənib, server köhnə qalıbsa, bu yazı köhnə versiyanı göstərir
const UI_VERSIYA = "1.1.1";
function versiyaCiz(r){
  let el = $("#versiya");
  if(!el){ el = document.createElement("div"); el.id = "versiya"; el.style.cssText = "font:10.5px var(--mono);color:var(--dim);padding:6px 8px 0"; $("#yan").appendChild(el); }
  const kohne = r.versiya !== UI_VERSIYA;
  if(r.istifadeci) window.waIstifadeci = r.istifadeci;
  const u = window.waIstifadeci;
  el.innerHTML = (u ? `<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--text)">
      <span title="${esc(u.login)}">👤 ${esc(u.ad)}</span><a href="/cixis" style="color:var(--red);text-decoration:none">Çıxış</a></div>` : "") +
    `Server v${esc(r.versiya || "?")} · başladı ${esc(r.baslama || "?")}` +
    (kohne ? `<div style="color:var(--amber)">Server köhnə versiyadadır. Ctrl+C, sonra python -m assistant.</div>` : "");
}
function modullarCiz(mods){
  $("#modullar").innerHTML = (mods || []).map(m => `<div class="mod ${m.status === "aktiv" ? "" : "plan"}" title="${esc(m.tesvir)}">
    <span class="nq"></span>${esc(m.ad)}${m.status === "aktiv" ? "" : '<span class="etiket">tezliklə</span>'}</div>`).join("");
  modulKartlari = (mods || []).filter(m => m.status === "aktiv").flatMap(m => (m.teklifler || []).map(t =>
    `<button class="teklif" data-s="${esc(t.s)}"><span class="modad">${esc(m.ad)}</span><b>${esc(t.b)}</b><span>${esc(t.a)}</span></button>`)).join("");
  kartlariCiz();
}
let modulKartlari = "", faylSorgulari = [], faylAdi = "";
// Boş ekranda yazı sahəsinin altındakı kartlar: fayl yüklənibsə — həmin faylın sorğuları, yoxsa — modulların nümunələri
function kartlariCiz(){
  $("#teklifler").innerHTML = faylSorgulari.length
    ? faylSorgulari.map(t => `<button class="teklif" data-s="${esc(t.replace(/ \(\d+\)$/, ""))}"><span class="modad">${esc(faylAdi)}</span><b>${esc(t)}</b></button>`).join("")
    : modulKartlari;
}
// ---------- fayla görə hazır sorğular ----------
function hazirlarCiz(list, ad){
  faylSorgulari = list || []; if(ad) faylAdi = ad; kartlariCiz();
  const el = $("#hazirlar");
  if(!list || !list.length){ el.classList.remove("var"); el.innerHTML = ""; return; }
  el.innerHTML = `<div class="bas">Bu fayl üçün hazır sorğular</div>` +
    `<div class="hs">` + list.map(t => `<button type="button" class="hazir-s" data-s="${esc(t.replace(/ \(\d+\)$/, ""))}">${esc(t)}</button>`).join("") + `</div>`;
  el.classList.add("var");
}
$("#hazirlar").addEventListener("click", e => { const b = e.target.closest(".hazir-s"); if(b && !mesgul) gonder(b.dataset.s); });
async function veziyyet(){
  const r = await fetch("/api/veziyyet").then(r => r.json());
  hazirlarCiz(r.hazir ? r.teklifler : [], r.fayl);
  const el = $("#rejim"), kod = r.rejim_kod || "qayda";
  el.className = "rejim " + kod; el.dataset.tip = r.rejim; el.setAttribute("aria-label", r.rejim);
  el.innerHTML = REJIM_IKON[kod] || REJIM_IKON.qayda;
  sideAlt(r); modullarCiz(r.modullar); versiyaCiz(r); return r;
}

// ---------- mətn formatı (sadə markdown) ----------
function md(t){
  const setirler = esc(t).split("\n"); let html = "", list = false;
  for(const s of setirler){
    const m = s.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!list){ html += "<ul>"; list = true; } html += `<li>${m[1]}</li>`; continue; }
    if(list){ html += "</ul>"; list = false; }
    if(s.trim()) html += `<p>${s}</p>`;
  }
  if(list) html += "</ul>";
  return html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}

// ---------- UI blokları ----------
function kartlarHtml(u){ return `<div class="kartlar">${u.kartlar.map(k => `<div class="kart"><div class="ad">${esc(k.ad)}</div><div class="deyer">${esc(k.deyer)}</div>${k.alt ? `<div class="alt">${esc(k.alt)}</div>` : ""}</div>`).join("")}</div>`; }
function cedvel(u){
  const ri = u.sutunlar.indexOf("Risk");
  const tr = u.setirler.map(s => "<tr>" + s.map((v,i) => i === ri ? `<td><span class="risk r-${esc(v)}">${esc(v)}</span></td>`
    : `<td class="${REQEM.has(u.sutunlar[i]) || REQEM_DEYER.test(String(v).trim()) ? "reqem" : ""}">${esc(v)}</td>`).join("") + "</tr>").join("");
  return `<h4>${esc(u.basliq)} · ${u.setirler.length}</h4><div class="cedvel-qab"><table class="${u.sutunlar.length > 5 ? "genis" : ""}"><thead><tr>${u.sutunlar.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${tr || `<tr><td colspan="${u.sutunlar.length}">Nəticə yoxdur</td></tr>`}</tbody></table></div>`;
}
const qerarHtml = q => `<span class="qerar-${esc(q)}">${q === "Bəli" ? "✓ Təsdiq" : "✗ Rədd"}</span>`;
function baglantilar(u){
  const tr = u.setirler.map(r => `<tr data-o="${esc(r.odenis_id)}" data-q="${esc(r.qaime_id)}">
    <td>${esc(r.tarix)}<br><small>${esc(r.axin)}</small></td><td class="ad">${esc(r.kontragent)}<br><small>${esc(r.metn)}</small></td>
    <td><b>${esc(r.qaime_id)}</b></td><td class="reqem">${esc(r.baglanan)}</td>
    <td><span class="risk r-${r.etibar === "Yüksək" ? "Aşağı" : "Orta"}">${esc(r.etibar)}</span><br><small>${esc(r.qayda)}</small></td>
    <td class="qerar">${r.tesdiq ? qerarHtml(r.tesdiq) : `<div class="duymeler"><button class="kicik b" data-q2="Bəli" title="Təsdiqlə" aria-label="Təsdiqlə">✓</button><button class="kicik x" data-q2="Xeyr" title="Rədd et" aria-label="Rədd et">✗</button></div>`}</td></tr>`).join("");
  return `<h4>Bağlantılar · ${u.setirler.length}</h4><div class="cedvel-qab"><table class="genis"><thead><tr><th>Tarix</th><th>Ödəniş</th><th>Qaimə</th><th>Məbləğ</th><th>Etibar və qayda</th><th>Qərar</th></tr></thead><tbody>${tr || '<tr><td colspan="6">Təsdiq gözləyən bağlantı yoxdur</td></tr>'}</tbody></table></div>`;
}
const mailto = (kime, movzu, metn) => `mailto:${encodeURIComponent(kime)}?subject=${encodeURIComponent(movzu)}&body=${encodeURIComponent(metn)}`;
function mektub(u){
  return `<div class="mektub" data-kime="${esc(u.kime)}" data-movzu="${esc(u.movzu)}"><div class="sah">Kimə: <b>${esc(u.kime)}</b></div><div class="sah">Mövzu: <b>${esc(u.movzu)}</b></div>
    <textarea>${esc(u.metn)}</textarea>
    <div class="duymeler"><button type="button" class="kicik" data-kopyala>Kopyala</button><a class="duyme" href="${mailto(u.kime, u.movzu, u.metn)}" data-mailto>E-poçtda aç</a></div></div>`;
}
function uiBlok(u){
  if(!u) return "";
  if(u.tip === "cedvel") return cedvel(u);
  if(u.tip === "baglantilar") return baglantilar(u);
  if(u.tip === "mektub") return mektub(u);
  if(u.tip === "fayl") return `<a class="duyme" href="${esc(u.url)}" download>⬇ ${esc(u.ad)}</a>`;
  if(u.tip === "fayllar") return `<div class="fayllar">${u.fayllar.map(f => `<a class="duyme" href="${esc(f.url)}" download>⬇ ${esc(f.ad)}</a>`).join(" ")}</div>`;
  if(u.tip === "kartlar") return kartlarHtml(u);
  if(u.tip === "sual") return `<div class="sual-v">${u.variantlar.map(v =>
    `<button type="button" class="sv ${v.esas ? "esas" : ""} ${v.ikinci ? "ikinci" : ""}" data-sual="${esc(v.mesaj)}">${esc(v.etiket)}</button>`).join("")}</div>`;
  return "";
}

// ---------- mesajlar ----------
const asagi = () => { const a = $("#axin"); a.scrollTop = a.scrollHeight; };
function userMsj(t){
  const d = document.createElement("div"); d.className = "msj user";
  d.innerHTML = `<div class="balon">${esc(t)}</div>`; $("#sohbet").appendChild(d); asagi(); return d;
}
function aiQab(){
  const d = document.createElement("div"); d.className = "msj ai";
  d.innerHTML = `<div class="ava">${WA_IKON}</div><div class="icerik"><div class="yazir ses" aria-label="Düşünür"><i></i><i></i><i></i><i></i><i></i></div></div>`;
  $("#sohbet").appendChild(d); asagi(); return d;
}
async function aiMsj(m, animasiya = true, qab = null){
  qab = qab || aiQab(); const ic = qab.querySelector(".icerik");
  const hs = m.hadiseler || [];
  ic.innerHTML = `<div class="metn"></div>`;
  const metnEl = ic.querySelector(".metn");
  if(animasiya){  // ChatGPT kimi hərf-hərf görünmə
    const sozler = (m.cavab || "").split(/(\s+)/);
    for(let i = 0; i < sozler.length; i++){ metnEl.textContent += sozler[i]; if(i % 3 === 0){ asagi(); await new Promise(r => setTimeout(r, 12)); } }
  }
  metnEl.innerHTML = md(m.cavab || "");
  if(hs.length) ic.insertAdjacentHTML("beforeend", `<div class="cipler">${hs.map(h => `<span class="cip">${esc(ALET[h.alet] || h.alet)}</span>`).join("")}</div>`);
  hs.forEach(h => { const b = uiBlok(h.ui); if(b) ic.insertAdjacentHTML("beforeend", `<div class="ui">${b}</div>`); });
  asagi();
}

let mesgul = false;
let gozleyenSual = null;  // fayl olmadan verilən sual: fayl yüklənəndən sonra avtomatik cavablandırılır
let sonSual = null;       // son sual: fayl dəyişəndə yeni fayl üzrə yenidən cavablandırılır
let faylVar = false;
async function cavabla(metn){
  mesgul = true; yeniləDuyme();
  const qab = aiQab();
  let r;
  try{
    r = await fetch("/api/sohbet", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mesaj:metn})}).then(r => r.json());
  }catch(e){ r = {cavab: "Serverə qoşulmaq alınmadı: " + e.message, hadiseler: []}; }
  await aiMsj(r, true, qab);
  if(aktiv){ aktiv.mesajlar.push({rol:"ai", cavab:r.cavab, hadiseler:r.hadiseler}); saxla(); }
  gozleyenSual = r.fayl_lazim ? metn : null;
  if((r.hadiseler || []).some(h => ["baglantini_tesdiqle", "bank_teyin", "hesab_ayarla"].includes(h.alet))) veziyyet();
  mesgul = false; yeniləDuyme();
}
async function gonder(metn){
  metn = metn.trim(); if(!metn || mesgul) return;
  mesgul = true; yeniləDuyme();
  $("#main").classList.remove("bos");
  if(!aktiv){ aktiv = {id: Date.now().toString(36), ad: metn.slice(0, 40), mesajlar: []}; sohbetler.unshift(aktiv); tarixceCiz(); }
  aktiv.mesajlar.push({rol:"user", metn}); userMsj(metn);
  sonSual = metn;
  await cavabla(metn);
}

// ---------- yazı sahəsi ----------
const giris = $("#giris");
function yeniləDuyme(){ $("#gonderBtn").disabled = mesgul || !giris.value.trim(); }
giris.addEventListener("input", () => { giris.style.height = "auto"; giris.style.height = giris.scrollHeight + "px"; yeniləDuyme(); });
giris.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#yaz").requestSubmit(); } });
$("#yaz").addEventListener("submit", e => { e.preventDefault(); const v = giris.value; giris.value = ""; giris.style.height = "auto"; gonder(v); });
$("#teklifler").addEventListener("click", e => { const b = e.target.closest(".teklif"); if(b) gonder(b.dataset.s); });

// ---------- fayl əlavə etmək ----------
$("#clip").onclick = () => $("#fayl").click();
$("#deyisBtn").onclick = () => $("#fayl").click();
// eyni faylı yenidən seçmək də işləsin deyə input sıfırlanır
// bir neçə fayl seçmək olar: məs. bank çıxarışı + «Sığorta haqqı inteqrasiya faylı» şablonu
$("#fayl").addEventListener("change", () => {
  const fs = [...$("#fayl").files]; $("#fayl").value = "";
  if(!fs.length) return;
  secilmisFayllar = fs;
  secilmisFayl = {name: fs.map(f => f.name).join(" + "), size: fs.reduce((a, f) => a + f.size, 0)};
  yukle();
});
// Dövrün sonu dəyişəndə fayl yenidən göndərilmir, yalnız uzlaşma yenidən hesablanır
let sonDovr = null;
$("#dovr").addEventListener("change", async () => {
  if(!$("#dovr").value || $("#dovr").value === sonDovr) return;
  sonDovr = $("#dovr").value;
  $("#eSt").textContent = "Yenidən uzlaşdırılır…";
  const r = await fetch("/api/dovr", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dovr_sonu: $("#dovr").value})});
  if(!r.ok){ $("#eSt").textContent = await xetaOxu(r); return; }
  const j = await r.json(); sideAlt(j);
  const k = Object.fromEntries(j.xulase.kartlar.map(x => [x.ad, x.deyer]));
  $("#eSt").textContent = `Uzlaşma faylı · ${k["Avtomatik bağlanıb"]} bağlandı · ${k["İstisnalar"]} istisna`;
  $("#main").classList.remove("bos");
  await aiMsj({cavab: `Dövrün sonu ${tarixAz(j.dovr_sonu)} olaraq dəyişdirildi və fayl yenidən uzlaşdırıldı.`, hadiseler:[{alet:"xulase", ui:j.xulase}]}, false);
});
const tarixAz = d => d.split("-").reverse().join(".");
// Serverin xəta cavabını oxunaqlı mətnə çevirir ([object Object] əvəzinə)
function xetaMetni(j, status){
  const d = j && j.detail;
  if(typeof d === "string") return d;
  if(Array.isArray(d)) return "Server sorğunu qəbul etmədi: " + d.map(x => x.msg || JSON.stringify(x)).join("; ") +
    ". Serveri yenidən başladın (Ctrl+C, sonra python -m assistant).";
  return `Xəta baş verdi${status ? " (" + status + ")" : ""}. Serveri yenidən başladıb yenidən cəhd edin.`;
}
async function xetaOxu(r){ let j = null; try { j = await r.json(); } catch {} return xetaMetni(j, r.status); }
const BASLIQ = "Bu gün hansı işi həll edək?";
const basliq = t => { $("#bos h1").textContent = t; };
async function yukle(){
  basliq("Fayl oxunur…");
  $("#elave").classList.add("var"); $("#eAd").textContent = secilmisFayl.name;
  $("#eSt").textContent = `Göndərilir… (${(secilmisFayl.size / 1048576).toFixed(1)} MB)`;
  const fd = new FormData(); secilmisFayllar.forEach(f => fd.append("fayl", f));
  $("#elave").classList.add("isleyir");
  const cavab0 = await new Promise(res => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/yukle");
    x.upload.onprogress = e => { if(e.lengthComputable){ const f = Math.round(e.loaded / e.total * 100);
      $("#eSt").textContent = `Göndərilir… ${f}% (${(secilmisFayl.size / 1048576).toFixed(1)} MB)`; basliq(`Fayl göndərilir… ${f}%`); } };
    x.onload = () => { if(x.status === 401){ location.href = "/giris"; return; } let j = null; try { j = JSON.parse(x.responseText); } catch {} res({ok: x.status < 300, status: x.status, j}); };
    x.onerror = () => res({ok: false, status: 0, j: {detail: "Serverə qoşulmaq alınmadı. Server işləyirmi?"}});
    x.send(fd);
  });
  if(!cavab0.ok){ $("#eSt").textContent = xetaMetni(cavab0.j, cavab0.status); $("#elave").classList.remove("isleyir"); basliq(BASLIQ); return; }
  const {is} = cavab0.j;
  // Böyük fayllar arxa planda çevrilir: vəziyyəti izləyirik
  let j;
  while(true){
    await new Promise(res => setTimeout(res, 700));
    const st = await fetch(`/api/yukle/${is}`).then(r => r.json());
    if(st.status === "xeta"){ $("#eSt").textContent = st.xeta; $("#elave").classList.remove("isleyir"); basliq(BASLIQ); return; }
    if(st.status === "hazir"){ j = st.netice; $("#elave").classList.remove("isleyir"); basliq("Fayl hazırdır. Sualınızı yazın."); break; }
    $("#eSt").textContent = st.n ? `Oxunur: ${st.i}/${st.n} vərəq · ${st.vereq}` : "Oxunur və təhlil edilir…";
    basliq(st.n ? `Fayl oxunur… ${st.i}/${st.n} vərəq` : "Fayl oxunur…");
  }
  sideAlt(j); hazirlarCiz(j.teklifler, j.fayl);
  // Dövrün sonu yalnız uzlaşma faylı üçün lazımdır
  $("#dovrQab").style.display = j.uzlasma ? "" : "none";
  if(j.uzlasma){ $("#dovr").value = j.dovr_sonu; sonDovr = j.dovr_sonu; }
  let mesaj, hadiseler;
  // inteqrasiya şablonu
  if(j.sablon && secilmisFayllar.some(f => f.name === j.sablon)){
    basliq(BASLIQ); faylVar = true; $("#main").classList.remove("bos");
    if(j.yalniz_sablon && !j.bank){
      $("#eSt").textContent = "İnteqrasiya şablonu · bank çıxarışı gözlənilir";
      await aiMsj({cavab: `«${j.sablon}» inteqrasiya şablonu kimi qəbul olundu. İndi bank çıxarışını yükləyin — şablonu doldurub geri verəcəyəm.`, hadiseler: []}, false);
      return;
    }
    if(j.bank){
      $("#eAd").textContent = j.fayl + " + " + j.sablon;
      $("#eSt").textContent = `Bank çıxarışı · ${reqemF(j.bank.daxilolma)} daxilolma · şablon: ${j.sablon}`;
      await aiMsj({cavab: `Bank çıxarışı (${reqemF(j.bank.daxilolma)} daxilolma) və «${j.sablon}» şablonu qəbul olundu. Şablonu doldururam.`, hadiseler: []}, false);
      await cavabla("Şablonu doldur");
      if(j.bank.sual){
        await aiMsj({cavab: `${j.bank.sual} daxilolmada əmin deyiləm — sizdən bir-bir soruşuram. Cavablardan sonra «Şablonu doldur» yazsanız, fayl yenidən hazırlanacaq.`, hadiseler: []}, false);
        await cavabla("Sualları ver");
      }
      return;
    }
  }
  if(j.uzlasma){
    const k = Object.fromEntries(j.xulase.kartlar.map(x => [x.ad, x.deyer]));
    $("#eSt").textContent = `Uzlaşma faylı · ${k["Avtomatik bağlanıb"]} bağlandı · ${k["İstisnalar"]} istisna`;
    mesaj = `«${secilmisFayl.name}» uzlaşma faylıdır və **${tarixAz(j.dovr_sonu)}** tarixinə uzlaşdırıldı (keçən ayın sonu).\nBaşqa dövr lazımdırsa, yuxarıdakı «Dövrün sonu» sahəsində tarixi dəyişin.`; hadiseler = [{alet:"xulase", ui:j.xulase}];
  } else if(j.bank){
    $("#eSt").textContent = `Bank çıxarışı · ${reqemF(j.bank.daxilolma)} daxilolma · ${j.bank.yoxlanmali} yoxlanmalı`;
    mesaj = `«${secilmisFayl.name}» bank çıxarışı kimi tanındı: ${reqemF(j.bank.daxilolma)} daxilolma.` +
      (j.bank.sual ? ` ${j.bank.sual} daxilolmada əmin deyiləm — sizdən bir-bir soruşuram.` : " Hamısı təsnif olundu.");
    hadiseler = [];
    // əmin olmadığı daxilolmalar varsa: dərhal mühasibdən soruş (başqa gözləyən sual yoxdursa)
    if(j.bank.sual && !gozleyenSual && !mesgul){
      basliq(BASLIQ); faylVar = true; $("#main").classList.remove("bos");
      await aiMsj({cavab: mesaj, hadiseler: []}, false);
      await cavabla("Sualları ver");
      return;
    }
  } else {
    $("#eSt").textContent = `Hazırdır · ${j.excel.vereq} vərəq · ${reqemF(j.excel.setir)} sətir`;
    mesaj = `«${secilmisFayl.name}» oxundu: ${j.excel.vereq} vərəq, ${reqemF(j.excel.setir)} sətir. Struktura baxaq, problemləri tapaq, yoxsa konkret sualınız var?`; hadiseler = [];
  }
  if(j.uzlasma) $("#main").classList.remove("bos");  // dövrün sonunu soruşmaq üçün mesajı həmişə göstər
  // fayl yüklənməmiş verilən sual varsa və ya fayl dəyişibsə: son sualı təkrar soruşmadan yeni fayl üzrə cavablandır
  const evvelVar = faylVar; faylVar = true;
  const sual = gozleyenSual || (evvelVar && !$("#main").classList.contains("bos") ? sonSual : null);
  if(sual && !mesgul){
    gozleyenSual = null;
    basliq(BASLIQ);
    $("#main").classList.remove("bos");
    await aiMsj({cavab: evvelVar ? `Fayl dəyişdi: «${secilmisFayl.name}». Son sualınızı yeni fayl üzrə cavablandırıram: «${sual}»`
                                 : `«${secilmisFayl.name}» oxundu. Sualınızı cavablandırıram: «${sual}»`, hadiseler: []}, false);
    await cavabla(sual);
    return;
  }
  if(!$("#main").classList.contains("bos")) await aiMsj({cavab: mesaj, hadiseler}, false);
}

// ---------- cədvəl düymələri ----------
$("#sohbet").addEventListener("click", async e => {
  const sv = e.target.closest("button[data-sual]");
  if(sv){ if(mesgul) return; sv.closest(".sual-v").classList.add("cavablandi"); gonder(sv.dataset.sual); return; }
  const b = e.target.closest("button[data-q2]");
  if(b){
    const tr = b.closest("tr"), dg = b.parentElement.querySelectorAll("button"); dg.forEach(x => x.disabled = true);
    const r = await fetch("/api/tesdiq", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({odenis_id:tr.dataset.o, qaime_id:tr.dataset.q, qerar:b.dataset.q2})});
    if(r.ok){ tr.querySelector(".qerar").innerHTML = qerarHtml(b.dataset.q2); veziyyet(); }
    else { dg.forEach(x => x.disabled = false); alert(await xetaOxu(r)); }
    return;
  }
  const k = e.target.closest("[data-kopyala]");
  if(k){ await navigator.clipboard.writeText(k.closest(".mektub").querySelector("textarea").value); k.textContent = "Kopyalandı ✓"; setTimeout(() => k.textContent = "Kopyala", 1500); }
});
$("#sohbet").addEventListener("input", e => {
  if(e.target.tagName !== "TEXTAREA") return;
  const box = e.target.closest(".mektub");
  box.querySelector("[data-mailto]").href = mailto(box.dataset.kime, box.dataset.movzu, e.target.value);
});

tarixceCiz();
veziyyet();
yeniləDuyme();
</script>
