# Android APK: server telefonun özündə (Chaquopy ilə Python). APK açılanda GitHub-dan main-in son versiyasını çəkir;
# bu iş yalnız APK-nın özünü (və içindəki ehtiyat versiyanı) qurur. Nəticə: «android-latest» buraxılışında APK.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy qurulma zamanı eyni Python versiyasını tələb edir (app/build.gradle: version "3.11")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ehtiyat versiya APK-ya (internet olmayanda işləsin)
        run: |
          cp -r assistant uzlasma android/app/src/main/python/
          find android/app/src/main/python -name __pycache__ -prune -exec rm -rf {} +

      - name: Versiya
        id: v
        run: echo "ad=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('assistant/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: İmza açarı (secret varsa)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PAROL: ${{ secrets.ANDROID_KEYSTORE_PAROL }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/wa.keystore"
            echo "WA_KEYSTORE=$RUNNER_TEMP/wa.keystore" >> "$GITHUB_ENV"
            echo "WA_KEYSTORE_PAROL=$PAROL" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret yoxdur — repodakı açıq açarla imzalanır (android/imza/wa.keystore)"
          fi

      - name: APK
        run: gradle -p android assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=${{ steps.v.outputs.ad }}

      - name: Adlandır (link həmişə eyni qalsın)
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WorkerAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorkerAssistant-apk
          path: WorkerAssistant.apk

      - name: Köhnə APK-ları sil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --json assets -q '.assets[].name' 2>/dev/null | while read -r ad; do
            gh release delete-asset android-latest "$ad" -y || true
          done

      - name: «android-latest» buraxılışı
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Worker's Assistant — Android (son versiya)
          body: |
            Telefonda öz serveri ilə işləyən Worker's Assistant. APK-nı yükləyin və quraşdırın («naməlum mənbə» icazəsi lazımdır).
            Tətbiq hər açılanda GitHub-dan main-in son versiyasını çəkir; internet yoxdursa, əvvəlki versiya ilə işləyir.
            Qurulub: ${{ steps.v.outputs.ad }} · commit ${{ github.sha }}
          files: WorkerAssistant.apk
          make_latest: false
