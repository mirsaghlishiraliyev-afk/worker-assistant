# Mövcud stack faylına (asis_timer ilə eyni fayla) əlavə edin:
#   - «services:» altına worker_assistant servisini,
#   - faylın sonuna (top-level) «secrets:» blokunu (artıq varsa, içinə wa_parol sətrini).
# Parol Docker secret-dədir — compose faylında, TeamCity-də və `docker inspect`-də görünmür.
# Serverdə BİR DƏFƏ:  printf '%s' 'PAROL' | docker secret create wa_parol -
services:
  worker_assistant:
    image: worker-assistant-dev-image
    environment:
      WA_HOST: 0.0.0.0
      WA_PORT: 8000
      WA_DATA: /data
      WA_LLM: qayda            # lokal rejim: məlumat serverdən kənara çıxmır
      WA_SIRKET: "Aqrar Sığorta Fondu"
      WA_ISTIFADECI: muhasib
    secrets:
      - wa_parol               # konteynerdə /run/secrets/wa_parol
    volumes:
      - /asis/worker-assistant:/data          # yüklənən fayllar, 1C keşi, hesabatlar, mühasibin qaydaları
      - /etc/localtime:/etc/localtime:ro
    ports:
      - target: 8000
        published: 4460                        # serverdə boş port seçin
        protocol: tcp
        mode: host
    deploy:
      replicas: 1                              # sessiya yaddaşdadır: mütləq 1 nüsxə
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == test.server
    networks:
      - asis_dev_network

secrets:
  wa_parol:
    external: true
